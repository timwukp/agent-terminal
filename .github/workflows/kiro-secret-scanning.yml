# Secret-scanning gate: uses Kiro CLI to detect hardcoded secrets, API keys,
# tokens, and credentials in the source tree. The repo mixes C, Rust, and
# TypeScript - all three ecosystems have distinct patterns for secrets (e.g.
# env-var fallback strings in C, compile-time constants in Rust, .env
# references in TypeScript) so a language-aware scan adds value beyond the
# redaction guard in ci.yml.
#
# Triggers mirror ci.yml: every push to main and every PR, so nothing merges
# unscanned. Job-level pull-requests: write lets Kiro post inline annotations
# on PRs without granting that scope to every other job or workflow.
name: kiro-secret-scanning

on:
  push:
    branches: [main]
  pull_request:

# Top-level read-only: the Kiro CLI reads source but never writes to the repo.
# Job-level permissions below grant PR-comment access only to the job that
# needs it, keeping the blast radius minimal if the install script or CLI
# binary were ever compromised.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # PR annotation requires write on pull-requests; scoped here so no other
    # job in this workflow (if added later) inherits it silently.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run secret scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kiro-cli scan secrets \
            --lang c,rust,typescript \
            --fail-on-detection
      - name: Annotate PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const message = '**Kiro Secret Scan** detected potential secrets in this PR. ' +
              'Please review the job log above and remove or rotate any exposed credentials.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
