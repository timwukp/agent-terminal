# AI-assisted secret scanning via Kiro CLI headless mode.
#
# This is the ADVISORY half of a two-layer scheme, and the distinction matters:
#
#   - Deterministic gates BLOCK. tools/check_redaction.sh (ci.yml) and
#     detect-secrets (pii-secrets-scan.yml) produce the same verdict on the
#     same bytes every run, so failing a merge on them is fair.
#   - This job REPORTS. An LLM's judgement is not reproducible run-to-run, so
#     gating a merge on it would make merges a coin flip and teach everyone to
#     re-run until green. It posts findings and always exits 0.
#
# What it buys over the regex gates: patterns nobody enumerated. The regex
# guards catch the six shapes they were written for; this reads the diff and
# can flag a credential-looking string in a shape no pattern anticipated —
# including secrets specific to this tree's three languages (an env-var
# fallback baked into C, a compile-time const in Rust, a bundled .env in the
# Tauri front end).
#
# Requires the KIRO_API_KEY repository secret (Settings -> Secrets and
# variables -> Actions). Headless mode reads that one variable and skips the
# browser login entirely; without it the CLI would try to open a browser on a
# runner that has none. The job SKIPS cleanly when the secret is absent rather
# than failing, so a fork PR — which never receives secrets — does not report a
# red X for a configuration gap it cannot fix.
name: kiro-secret-scanning

on:
  push:
    branches: [main]
  pull_request:

# Top-level read-only. The scan reads source and writes nothing to the repo;
# the PR-comment scope lives on the single job that needs it, so a compromised
# install script or CLI build inherits as little as possible.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to post the findings comment. Never used to push.
      pull-requests: write
    steps:
      # fetch-depth: 0 — the diff below needs the base branch, which a shallow
      # clone does not have.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Gate every later step on the secret existing. Checking it here, once,
      # keeps the `if:` conditions below readable — and secrets cannot be used
      # in a job-level `if:` at all.
      - name: Check for API key
        id: key
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          if [ -n "$KIRO_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "note: KIRO_API_KEY is not set — skipping the advisory scan." \
                 "The deterministic gates (check_redaction.sh, detect-secrets) still ran."
          fi

      - name: Install Kiro CLI
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # A silent install failure would otherwise surface as a confusing
          # "command not found" two steps later.
          "$HOME/.local/bin/kiro-cli" --version

      - name: Collect changed files
        if: steps.key.outputs.present == 'true'
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
          fi
          # Lockfiles are machine-generated and enormous; their hashes look like
          # secrets to a language model and read as noise to a human.
          grep -vE '(package-lock\.json|Cargo\.lock)$' /tmp/changed.txt \
            > /tmp/scan.txt || true
          echo "count=$(wc -l < /tmp/scan.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Scan changed files
        if: steps.key.outputs.present == 'true' && steps.changed.outputs.count != '0'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          # --trust-tools=fs_read: read-only, pre-approved. The CLI would
          # otherwise stop to ask for confirmation on a runner with no one to
          # answer. Nothing here may write, execute, or reach the network.
          #
          # `|| true` is the advisory posture, stated once: a scan that cannot
          # run must not block a merge, because the blocking verdicts come from
          # the deterministic gates. An outage here is a missing comment, not a
          # red build.
          kiro-cli chat --no-interactive --trust-tools=fs_read \
            "Review these changed files for leaked secrets and credentials:

          $(cat /tmp/scan.txt | head -40)

          Report only findings you can point at a specific line for. For each:
          file, line, what it appears to be, severity, and how to remediate.
          Look for API keys and tokens (AWS, GCP, Azure, GitHub, Slack),
          passwords, private keys (RSA/SSH/PGP), database connection strings
          carrying credentials, JWTs or session secrets, and committed .env
          contents.

          This repo is a terminal multiplexer whose test suite contains
          deliberate byte patterns and protocol fixtures. Treat test data and
          fixtures as such and do not report them. If nothing is wrong, say so
          in one line and stop." \
            > /tmp/findings.md 2>&1 || true

          echo "=== findings ==="
          cat /tmp/findings.md

      - name: Post findings
        if: steps.key.outputs.present == 'true' && steps.changed.outputs.count != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let findings = '_The scan produced no output._';
            try {
              const raw = fs.readFileSync('/tmp/findings.md', 'utf8').trim();
              if (raw) {
                // A PR comment caps at 65536 characters; leave room for the
                // wrapper text so an overlong report cannot 422 the API call.
                findings = raw.length > 60000
                  ? raw.slice(0, 60000) + '\n\n_[truncated]_'
                  : raw;
              }
            } catch (e) {
              findings = `_Could not read the scan output: ${e.message}_`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Kiro secret scan (advisory)\n\n' + findings +
                '\n\n---\n_Advisory only — this check does not block merges. ' +
                'The blocking gates are `check_redaction.sh` and `detect-secrets`._'
            });
