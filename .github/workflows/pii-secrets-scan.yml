# PII and secrets detection using detect-secrets (Yelp) plus custom PII regex
# patterns. Unlike the Kiro-based secret scanner, this uses a well-known
# open-source baseline approach: detect-secrets generates a baseline of known
# findings, and new secrets trigger a non-zero exit. The PII patterns catch
# email addresses, phone numbers, and government ID formats that might slip
# into test fixtures or comments.
#
# File extensions reflect this repo's stack: C (.c, .h), Rust (.rs),
# TypeScript (.ts, .tsx), plus docs and config (.md, .yml, .yaml, .json).
# Python is absent because the repo has no Python source - only build scripts
# which are excluded from PII scanning.
name: pii-secrets-scan

on:
  push:
    branches: [main]
  pull_request:

# Read-only: detect-secrets reads files, writes nothing to the repo.
permissions:
  contents: read

jobs:
  pii-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '\.git/.*' \
            --exclude-files 'build/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files 'target/.*' \
            > /tmp/secrets-report.json
          # Fail if any secrets are found (results map is non-empty)
          python3 -c "
          import json, sys
          with open('/tmp/secrets-report.json') as f:
              report = json.load(f)
          results = report.get('results', {})
          if results:
              print(f'ERROR: detect-secrets found findings in {len(results)} file(s):')
              for path, findings in results.items():
                  for finding in findings:
                      print(f'  {path}:{finding[\"line_number\"]} - {finding[\"type\"]}')
              sys.exit(1)
          print('PASS: no secrets detected')
          "

      - name: PII pattern scan
        run: |
          # Scan source and doc files for common PII patterns
          EXTENSIONS="c h rs ts tsx md yml yaml json"
          PATTERNS=(
            '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}'
            '\b\d{3}[-.]?\d{3}[-.]?\d{4}\b'
            '\b\d{3}-\d{2}-\d{4}\b'
          )
          found=0
          for ext in $EXTENSIONS; do
            while IFS= read -r file; do
              [ -f "$file" ] || continue
              for pattern in "${PATTERNS[@]}"; do
                if grep -Pn "$pattern" "$file" | grep -v '^\s*#' | grep -v '^\s*//' | grep -v 'example\|test\|placeholder\|noreply'; then
                  echo "PII pattern match in: $file"
                  found=1
                fi
              done
            done < <(find . -name "*.${ext}" -not -path './.git/*' -not -path './build/*' -not -path './node_modules/*' -not -path './target/*')
          done
          if [ "$found" -ne 0 ]; then
            echo "ERROR: potential PII found - review matches above"
            exit 1
          fi
          echo "PASS: no PII patterns detected"
