# CI for the GUI apps under app/ only. Path-filtered so C changes never
# wait on Rust/Node toolchains; the C workflow (ci.yml) is untouched and
# unfiltered. These jobs must stay NON-REQUIRED in branch protection:
# a required path-filtered check never reports on non-app PRs and would
# block their merges.
name: app-ci

# Without this block every job runs with the repository-default token, which
# for this repo is read/write on contents. No job here writes anything, so
# say so explicitly — a token is only as narrow as the workflow that declares
# it, and a compromised third-party action inherits whatever it is handed.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']

defaults:
  run:
    working-directory: app/tauri

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux webkit deps (tauri)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/tauri/src-tauri
      - run: cargo fmt --check
        working-directory: app/tauri/src-tauri
      # The app binary is excluded here: tauri::generate_context! embeds
      # the frontend dist, which only the tauri-build job produces. The
      # library crates carry all the logic; the binary is compile-smoked
      # by tauri-build with the frontend in place.
      - run: cargo clippy --workspace --exclude agent-terminal-gui --all-targets -- -D warnings
        working-directory: app/tauri/src-tauri
      # Build the REAL daemon for at-client's integration tests — they
      # skip without it, and AT_REQUIRE_DAEMON turns a skip into a
      # failure so CI can never green-light nine tests that ran nothing.
      - run: make all
        working-directory: .
      - run: cargo test --workspace --exclude agent-terminal-gui
        working-directory: app/tauri/src-tauri
        env:
          AT_REQUIRE_DAEMON: "1"

  # Mutation testing on the protocol codec: a codec bug is a wire bug,
  # so its tests must be strong enough that mutated code fails them.
  # Scoped to at-proto (pure, fast); a missed mutant fails the job.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/tauri/src-tauri
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo mutants -p at-proto --no-times --timeout 120
        working-directory: app/tauri/src-tauri

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tauri/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Compile smoke of the full Tauri app (needs the frontend dist first).
  # Debug build, no bundling, no signing.
  tauri-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tauri/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/tauri/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo build
        working-directory: app/tauri/src-tauri
      # The binary crate's unit tests (templates resolve) can only run
      # where the frontend dist exists — generate_context! embeds it.
      - run: cargo test -p agent-terminal-gui
        working-directory: app/tauri/src-tauri
      # The staleness guard in build.rs is the only thing standing between
      # a Rust-only rebuild and a binary that pairs new commands with old
      # JavaScript (measured: it rejected 100% of keystrokes and read as a
      # product bug). Assert it actually fires, because a guard that has
      # silently stopped failing is worse than no guard — it reads clean.
      - name: staleness guard fails on a stale dist
        working-directory: app/tauri
        run: |
          set -u
          sleep 1 && touch src/App.tsx
          if (cd src-tauri && cargo build) 2>build.log; then
            echo "GUARD DID NOT FIRE: cargo build succeeded with a stale dist" >&2
            exit 1
          fi
          grep -q "stale frontend bundle" build.log \
            || { echo "build failed, but not on the guard:" >&2; cat build.log >&2; exit 1; }
          echo "guard fired as expected"
          npm run build   # leave the tree consistent
