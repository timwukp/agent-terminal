# CI for the GUI apps under app/ only. Path-filtered so C changes never
# wait on Rust/Node toolchains; the C workflow (ci.yml) is untouched and
# unfiltered. These jobs must stay NON-REQUIRED in branch protection:
# a required path-filtered check never reports on non-app PRs and would
# block their merges.
name: app-ci

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']

defaults:
  run:
    working-directory: app/tauri

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webkit deps (tauri)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/tauri/src-tauri
      - run: cargo fmt --check
        working-directory: app/tauri/src-tauri
      # The app binary is excluded here: tauri::generate_context! embeds
      # the frontend dist, which only the tauri-build job produces. The
      # library crates carry all the logic; the binary is compile-smoked
      # by tauri-build with the frontend in place.
      - run: cargo clippy --workspace --exclude agent-terminal-gui --all-targets -- -D warnings
        working-directory: app/tauri/src-tauri
      # Build the REAL daemon for at-client's integration tests — they
      # skip without it, and AT_REQUIRE_DAEMON turns a skip into a
      # failure so CI can never green-light nine tests that ran nothing.
      - run: make all
        working-directory: .
      - run: cargo test --workspace --exclude agent-terminal-gui
        working-directory: app/tauri/src-tauri
        env:
          AT_REQUIRE_DAEMON: "1"

  # Mutation testing on the protocol codec: a codec bug is a wire bug,
  # so its tests must be strong enough that mutated code fails them.
  # Scoped to at-proto (pure, fast); a missed mutant fails the job.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/tauri/src-tauri
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants -p at-proto --no-times --timeout 120
        working-directory: app/tauri/src-tauri

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tauri/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Compile smoke of the full Tauri app (needs the frontend dist first).
  # Debug build, no bundling, no signing.
  tauri-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tauri/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/tauri/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo build
        working-directory: app/tauri/src-tauri
