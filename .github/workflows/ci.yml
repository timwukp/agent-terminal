name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        build: [release, asan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make BUILD=${{ matrix.build }} all
      - name: Unit tests
        run: make BUILD=${{ matrix.build }} test
      - name: Integration tests
        if: matrix.build == 'release'
        # BUILD must match the variant built above: the scripts resolve
        # build/$BUILD, so an unset BUILD silently tests binaries that were
        # never compiled.
        env:
          BUILD: ${{ matrix.build }}
        run: |
          rc=0
          for t in tests/integration/test_*.sh; do
            echo "== $t"
            bash "$t" || rc=1
          done
          exit $rc

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz targets
        run: make BUILD=fuzz fuzz CC=clang
      - name: Generate corpus
        run: python3 tools/gen_corpus.py 200
      - name: 60s smoke fuzz per target
        run: |
          for f in build/fuzz/fuzz/*; do
            [ -x "$f" ] || continue
            case "$f" in *_regress) continue;; esac
            echo "== $f"
            "$f" -max_total_time=60 -timeout=5 -dict=fuzz/dict/vt.dict fuzz/corpus/vt || exit 1
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagram geometry (co-visible overlaps, bounds)
        run: python3 tools/check_svg.py docs/architecture.svg
      - name: Docs cross-references resolve
        run: bash tools/check_links.sh

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-tidy
      - name: Analyze all four source dirs
        # Flags must match the real build (see Makefile COMMON_CFLAGS), or
        # clang-tidy analyzes a different translation unit than ships. The
        # generated version header is stubbed: its content is irrelevant to
        # analysis and generating it for real would need a build first.
        # Scope grew from vt+common to everything once client+daemon were
        # made clean — 15 findings lived there precisely because they were
        # outside this gate.
        run: |
          mkdir -p /tmp/tidy-inc
          printf '#define AT_VERSION "tidy"\n' > /tmp/tidy-inc/at_version.h
          clang-tidy --warnings-as-errors='*' \
            src/vt/*.c src/common/*.c src/client/*.c src/daemon/*.c -- \
            -std=c17 -Isrc -I/tmp/tidy-inc \
            -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -D_DARWIN_C_SOURCE
