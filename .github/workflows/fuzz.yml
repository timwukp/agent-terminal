name: nightly-fuzz

# No job here writes repo contents — the corpus cache and crash artifacts go
# through the cache/artifact services, which use the runtime token, not this
# one. Say so explicitly rather than inheriting the repo-default read/write.
permissions:
  contents: read

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off the top of the hour
  workflow_dispatch: {}

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_vt_feed, fuzz_proto]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/vt
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Generate seed corpus
        run: python3 tools/gen_corpus.py 200
      - name: Build fuzz target
        run: make fuzz BUILD=fuzz CC=clang
      - name: Fuzz 30 minutes
        run: |
          mkdir -p artifacts
          ./build/fuzz/fuzz/${{ matrix.target }} \
            -max_total_time=1800 -timeout=10 -rss_limit_mb=2048 \
            -dict=fuzz/dict/vt.dict \
            -artifact_prefix=artifacts/ \
            fuzz/corpus/vt
      - name: Minimize corpus for next night
        if: success()
        run: |
          mkdir -p corpus_min
          ./build/fuzz/fuzz/${{ matrix.target }} \
            -merge=1 corpus_min fuzz/corpus/vt
          rm -rf fuzz/corpus/vt
          mv corpus_min fuzz/corpus/vt
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashers-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
