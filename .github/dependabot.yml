# Three ecosystems, three manifests. The github-actions entry is what keeps
# the SHA pins in the workflows honest: every `uses:` is pinned to a full
# commit SHA (tools/check_workflow_pins.sh enforces it), so without Dependabot
# a pin would silently age forever — the PRs it opens are how a pin moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The pins deliberately track a chosen major line (see the workflows'
    # comments): a major bump changes an action's contract and is a human
    # decision, not a hygiene update. Minor/patch PRs still arrive; on its
    # first run Dependabot proposed four major jumps (checkout 4->7, cache
    # 4->6, setup-node 4->7, upload-artifact 4->7) that a "keep the pins
    # fresh" config was never meant to decide.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /app/tauri/src-tauri
    schedule:
      interval: weekly
    # Lockfile-only churn is noise for a 488-crate tree; group patch bumps.
    groups:
      cargo-patch:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /app/tauri
    schedule:
      interval: weekly
    # React majors are a coordinated migration (react, react-dom and both
    # @types packages move together, and React 19 changes rendering
    # behavior), so a bot bumping any one of them alone is broken by
    # construction — its first attempt (react-dom 19 against react 18) could
    # not even `npm ci`. Majors for the rest of the tree stay allowed: they
    # arrive one dependency per PR, where CI can judge them and
    # `@dependabot ignore` works when it can't.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
