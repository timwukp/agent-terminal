<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="t d">
  <title id="t">agent-terminal architecture: the front-end crashes, the session does not</title>
  <desc id="d">A thin client (agent-terminal attach) runs inside any hosting terminal and connects
over a unix socket (mode 0600, in a 0700 directory, peer-UID verified) to agent-terminald, a per-user
daemon. The daemon owns the PTY running the child program, the emulated VT screen state, and a
CRC-framed on-disk scrollback log. The animation shows four phases: normal operation with output
streaming to the client; the hosting terminal dying and the client process disappearing; the daemon
continuing untouched with the child process still running; and a new client attaching and receiving a
snapshot repaint that restores the exact screen, cursor and terminal modes.</desc>

  <rect x="0" y="0" width="900" height="580" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace">

    <text x="450" y="37" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="600">The front-end crashes. The session does not.</text>
    <text x="450" y="60" text-anchor="middle" fill="#8b949e" font-size="12.5">session state lives in the daemon, never in the renderer</text>

    <!-- ================= hosting terminal + thin client ================= -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.24;0.27;0.30;0.50;0.55;1" values="1;1;1;0.10;0.10;1;1"/>
      <rect x="110" y="86" width="680" height="104" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6">
        <animate attributeName="stroke" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.24;0.255;0.30;0.50;0.55;1"
                 values="#58a6ff;#58a6ff;#f85149;#f85149;#f85149;#58a6ff;#58a6ff"/>
      </rect>
      <text x="132" y="112" fill="#6e7681" font-size="11">HOSTING TERMINAL — Terminal.app / iTerm2 / Ghostty / over SSH</text>
      <text x="132" y="143" fill="#58a6ff" font-size="16" font-weight="600">agent-terminal attach</text>
      <text x="356" y="143" fill="#8b949e" font-size="12.5">thin client — owns no state</text>
      <text x="132" y="171" fill="#6e7681" font-size="11">kill it, or force-quit the whole terminal — nothing of value is here</text>
    </g>

    <!-- alive / crashed status badges (mutually exclusive) -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.235;0.25;0.545;0.56;1" values="1;1;0;0;1;1"/>
      <circle cx="676" cy="140" r="4" fill="#3fb950"/>
      <text x="768" y="145" text-anchor="end" fill="#3fb950" font-size="12.5">attached</text>
    </g>
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.245;0.26;0.53;0.55;1" values="0;0;1;1;0;0"/>
      <text x="768" y="145" text-anchor="end" fill="#f85149" font-size="12.5" font-weight="600">process gone</text>
    </g>

    <!-- ================= the socket ================= -->
    <line x1="450" y1="192" x2="450" y2="298" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M450 192 l-5 9 l10 0 z" fill="#30363d"/>
    <text x="470" y="226" fill="#8b949e" font-size="12">unix socket · 0600 · dir 0700 · peer-UID verified</text>
    <text x="470" y="245" fill="#6e7681" font-size="11">no network listener of any kind</text>
    <text x="270" y="226" text-anchor="end" fill="#6e7681" font-size="11">keystrokes ↓   output ↑</text>

    <!-- output flowing up to an attached client -->
    <g fill="#3fb950">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.23;0.25;0.55;0.575;1" values="1;1;0;0;1;1"/>
      <circle cx="450" cy="296" r="3.5">
        <animate attributeName="cy" values="296;194" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="296" r="3.5">
        <animate attributeName="cy" values="296;194" dur="1.7s" begin="0.57s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" begin="0.57s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="296" r="3.5">
        <animate attributeName="cy" values="296;194" dur="1.7s" begin="1.14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" begin="1.14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- the snapshot repaint: one bright pulse on reattach -->
    <g>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.555;0.57;0.65;0.67;1" values="0;0;1;1;0;0"/>
      <circle cx="450" cy="296" r="7" fill="#d29922">
        <animate attributeName="cy" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.56;0.66;1" values="296;296;194;194"/>
      </circle>
      <text x="470" y="272" fill="#d29922" font-size="11.5" font-weight="600">SNAPSHOT repaint</text>
    </g>

    <!-- ================= the daemon ================= -->
    <rect x="110" y="300" width="680" height="200" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6">
      <animate attributeName="stroke-width" values="1.6;2.6;1.6" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <text x="132" y="328" fill="#3fb950" font-size="16" font-weight="600">agent-terminald</text>
    <text x="290" y="328" fill="#8b949e" font-size="12.5">per-user daemon — owns everything that matters</text>
    <g>
      <rect x="672" y="314" width="96" height="20" rx="10" fill="#0d3f1c" stroke="#3fb950" stroke-width="0.8"/>
      <circle cx="688" cy="324" r="3.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="760" y="328" text-anchor="end" fill="#3fb950" font-size="11" font-weight="600">SURVIVES</text>
    </g>

    <!-- PTY row: the child keeps working even with nobody watching -->
    <rect x="132" y="344" width="636" height="44" rx="7" fill="#0d1117" stroke="#21262d"/>
    <text x="150" y="371" fill="#e6edf3" font-size="13">PTY ── claude / vim / ssh / $SHELL</text>
    <rect x="432" y="360" width="7" height="14" fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <text x="752" y="371" text-anchor="end" fill="#6e7681" font-size="11">child pid never changes</text>

    <rect x="132" y="396" width="636" height="44" rx="7" fill="#0d1117" stroke="#21262d"/>
    <text x="150" y="423" fill="#e6edf3" font-size="13">VT screen state — grid, cursor, modes, alt screen</text>
    <text x="752" y="423" text-anchor="end" fill="#6e7681" font-size="11">syscall-free · fuzzed nightly</text>

    <rect x="132" y="448" width="636" height="44" rx="7" fill="#0d1117" stroke="#21262d"/>
    <text x="150" y="475" fill="#e6edf3" font-size="13">scrollback → disk</text>
    <text x="752" y="475" text-anchor="end" fill="#6e7681" font-size="11">CRC-framed · 2×32 MiB rotation · outlives the daemon</text>
    <g>
      <circle cx="345" cy="469" r="3" fill="#d29922">
        <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="345;420" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ================= phase caption ================= -->
    <g font-size="13" text-anchor="middle">
      <text x="450" y="534" fill="#8b949e">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.22;0.24;1" values="1;1;0;0"/>
        Normal operation — the daemon streams output to the attached client
      </text>
      <text x="450" y="534" fill="#f85149">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.245;0.26;0.40;0.42;1" values="0;0;1;1;0;0"/>
        The hosting terminal dies under a huge dialog — the client is gone
      </text>
      <text x="450" y="534" fill="#3fb950">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.415;0.43;0.53;0.55;1" values="0;0;1;1;0;0"/>
        Daemon untouched: the PTY, the screen and the scrollback keep running
      </text>
      <text x="450" y="534" fill="#d29922">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.545;0.56;0.80;0.82;1" values="0;0;1;1;0;0"/>
        agent-terminal attach — snapshot restores exact screen, cursor and modes
      </text>
      <text x="450" y="534" fill="#e6edf3">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.815;0.83;0.97;1" values="0;0;1;1;0"/>
        Back to work. The child process never noticed anything happened.
      </text>
    </g>

    <text x="450" y="560" text-anchor="middle" fill="#484f58" font-size="10.5">agent-terminal · C17 · macOS + Linux · zero dependencies beyond libc</text>
  </g>
</svg>
