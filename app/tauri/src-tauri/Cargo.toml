[workspace]
members = ["crates/at-proto", "crates/at-client", "crates/claude-watch", "crates/hooks-model"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[package]
name = "agent-terminal-gui"
version = "0.1.0"
description = "GUI client for agent-terminal (Tauri + xterm.js)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
at-proto = { path = "crates/at-proto" }
at-client = { path = "crates/at-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
strip = true
