[package]
name = "claude-watch"
version = "0.1.0"
description = "Claude Code transcript watcher: per-session token usage from ~/.claude/projects JSONL"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
