[package]
name = "at-client"
version = "0.1.0"
description = "Connection management for the agent-terminal GUI: unix socket, HELLO/ATTACH, backpressure"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
at-proto = { path = "../at-proto" }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
tempfile = "3"
